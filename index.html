<title>Hawajiz Beirut</title>
<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Lalezar&display=swap">
<style id="css">
/* Layout: one narrow phone-first column, Arabic RTL by default. Road-barrier stripe on the header is the only loud element; everything else is quiet asphalt and signal colours. */
:root{
  --bg:#101317; --surface:#191E24; --ink:#EDF0F3; --muted:#98A2AD; --line:#2A3139;
  --signal:#F5C02A; --signal-ink:#1A1500; --alert:#FF6157; --alert-soft:#3A1A19;
  --warn:#F5C02A; --warn-soft:#332A0E; --ok:#45C982; --ok-soft:#14301F;
  --stripe-dark:#101317; --on-alert:#1A0606; color-scheme:dark;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --dw:700; --dcase:uppercase; --dtrack:.02em; --dlh:1.05;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
:root[lang="ar"]{--display:"Lalezar","IBM Plex Sans Arabic",system-ui,sans-serif; --dw:400; --dcase:none; --dtrack:0; --dlh:1.25}
/* Dark is the house theme; light only when the visitor picks it. */
:root[data-theme="light"]{
  --bg:#E9ECEF; --surface:#FFFFFF; --ink:#14181D; --muted:#5A636E; --line:#D3D9DF;
  --signal:#F2B705; --signal-ink:#1A1500; --alert:#C8211A; --alert-soft:#FBE4E2;
  --warn:#8A6100; --warn-soft:#FFF3CC; --ok:#1C7F47; --ok-soft:#DDF3E6;
  --stripe-dark:#14181D; --on-alert:#FFFFFF; color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.disp{font-family:var(--display);font-weight:var(--dw);text-transform:var(--dcase);letter-spacing:var(--dtrack);line-height:var(--dlh)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.stripe{height:8px;background:repeating-linear-gradient(-45deg,var(--signal) 0 14px,var(--stripe-dark) 14px 28px)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px}
.brand h1{font-size:28px;margin:0;min-width:0}
.brand small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400;margin-top:3px;line-height:1.4}
.brand-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 12px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink);min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.btn.primary:hover{filter:brightness(.96)}
.btn.danger{color:var(--alert)}
.btn.small{min-height:34px;padding:5px 10px;font-size:13px}
.btn.icon{width:40px;padding:0}
.btn.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.lang{font-family:var(--body);padding:8px 10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:6px;padding-block:0 10px;align-items:stretch}
.tab{flex:1 1 0;min-width:0;border:1px solid transparent;background:transparent;border-radius:6px;padding:8px 6px;font-size:20px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.tab.side{flex:0 0 auto;font-size:15px;padding:8px 12px;border-color:var(--line)}
.tab.side[aria-selected="true"]{border-color:var(--ink)}
.brand-id{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;border:1px solid var(--line)}
.tab .count{font-family:var(--mono);font-size:12px;background:var(--alert);color:var(--on-alert);border-radius:999px;padding:1px 7px;letter-spacing:0;line-height:1.5}
main{padding-block:16px 48px;display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-head h2{font-size:22px;margin:0}
.meta{color:var(--muted);font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card.live{border-color:var(--alert)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.area{font-size:26px;margin:0;overflow-wrap:anywhere;text-wrap:balance;min-width:0}
.card.old .area{font-size:20px;color:var(--muted)}
.where{font-weight:500;overflow-wrap:anywhere}
.note{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.row{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center}
.chip{font-size:12px;border-radius:4px;padding:2px 8px;white-space:nowrap;font-weight:600}
.chip.confirmed{background:var(--alert);color:var(--on-alert)}
.chip.unconfirmed{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.chip.cleared{background:var(--ok-soft);color:var(--ok)}
.chip.expired{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:28px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .big{font-size:26px;color:var(--ok);margin:0}
.day{font-size:12.5px;font-weight:600;color:var(--muted);margin:8px 0 -4px}
.ad{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;gap:14px;align-items:center;min-width:0;text-decoration:none;color:var(--ink)}
.ad.has-img{flex-direction:column;align-items:stretch}
.ad img{width:100%;max-height:220px;object-fit:cover;border-radius:6px;display:block}
.ad-body{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.ad-tag{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;align-self:flex-start}
.ad-title{font-size:21px;margin:0;overflow-wrap:anywhere}
.ad-text{margin:0;font-size:14px;overflow-wrap:anywhere}
.ad.placeholder{border-style:dashed;background:transparent}
.ad.placeholder .ad-title{color:var(--muted)}
form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.legend{font-size:13.5px;font-weight:600}
.hint{font-size:12.5px;color:var(--muted);font-weight:400}
input[type=text],input[type=tel],input[type=url],input[type=number],input[type=time],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-height:44px}
input[type=file]{font-size:13px;max-width:100%}
textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:460px){.grid2{grid-template-columns:1fr}}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{position:relative}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice span{display:inline-flex;align-items:center;min-height:40px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;background:var(--surface);font-size:14px}
.choice input:checked+span{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.choice input:focus-visible+span{outline:3px solid var(--signal);outline-offset:2px}
.preview{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;font-size:14px;overflow-wrap:anywhere;margin:0;font-family:var(--body)}
.callout{background:var(--warn-soft);border:1px solid var(--warn);color:var(--ink);border-radius:8px;padding:12px 14px;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:20px;margin:0}
details.panel summary{cursor:pointer;font-size:20px;list-style:none}
details.panel summary::-webkit-details-marker{display:none}
details.panel summary::after{content:" +";color:var(--muted)}
details[open].panel summary::after{content:" −"}
.thumb{max-width:180px;border-radius:6px;border:1px solid var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.savebar{position:sticky;bottom:0;z-index:4;background:var(--ink);color:var(--surface);border-radius:8px;padding:10px 14px;margin-bottom:env(safe-area-inset-bottom,0px);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.savebar .btn{border-color:var(--signal)}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,12,15,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);color:var(--ink);border-radius:12px;padding:20px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px}
.sheet h3{font-size:24px;margin:0}
.number{font-family:var(--mono);font-size:22px;letter-spacing:.04em;user-select:all;background:var(--bg);border-radius:6px;padding:10px 12px;text-align:center;overflow-wrap:anywhere;direction:ltr}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--surface);border-radius:8px;padding:10px 16px;font-size:14px;font-weight:500;max-width:calc(100% - 32px)}
.adslot{display:flex;flex-direction:column;gap:6px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--signal)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;padding:8px}
.sitefoot{padding-block:0 32px;text-align:center}
.adrow{display:flex;gap:12px;align-items:flex-start}
.adrow img{width:72px;height:72px;object-fit:cover;border-radius:6px;flex:none}
.chip.paused{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.chip.scheduled{background:var(--warn-soft);color:var(--warn)}
.loading{color:var(--muted);text-align:center;padding:28px 0}
.foot{color:var(--muted);font-size:12.5px;text-align:center;padding-top:6px}
@media (prefers-reduced-motion:no-preference){.card.live .chip.confirmed{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.7}}}
</style>
</head>

function shortDate(ts){try{return new Date(ts).toLocaleDateString(loc(),{day:'numeric',month:'short',timeZone:'Asia/Beirut'});}catch(e){return dayKey(ts);}}
function ago(ts){
  var m=Math.round((Date.now()-ts)/6e4),h=Math.floor(m/60),d=Math.floor(h/24);
  if(lang==='ar'){if(m<1)return 'هلّق';if(m<60)return 'من '+minAr(m);if(h<24)return 'من '+hrsAr(h)+(m%60?' و'+minAr(m%60):'');return 'من '+daysAr(d);}
  if(m<1)return 'just now';if(m<60)return m+' min ago';if(h<24)return h+' h '+(m%60?m%60+' min ':'')+'ago';return d+(d===1?' day ago':' days ago');
}

function currentList(){return state.items.filter(isCurrent).sort(function(a,b){if((a.status==='confirmed')!==(b.status==='confirmed'))return a.status==='confirmed'?-1:1;return b.reportedAt-a.reportedAt;});}

function activeAds(){return (state.settings.ads||[]).filter(function(a){return adStatus(a)==='running';});}

function channelText(it){
  if(lang==='ar'){
    var pa='📍 '+[it.area,it.spot,it.direction?('باتجاه '+it.direction):''].filter(Boolean).join('، ');
    if(it.status==='cleared')return '✅ خلص – '+it.area+'\nشالوا الحاجز الساعة '+clock(it.clearedAt||Date.now());
    if(it.status==='unconfirmed')return '⚠️ مش مؤكد\n'+pa+'\n🕘 '+clock(it.reportedAt)+'\nفي خبر عن حاجز، ناطرين تأكيد';
    var ta='🚨 حاجز – مؤكد\n'+pa+'\n🕘 '+clock(it.reportedAt)+'\n🚛 '+kindOf(it.kind).ar;
    if(it.reports>1)ta+='\n👥 '+nRepAr(it.reports);
    if(it.note)ta+='\n'+it.note;
    return ta;
  }
  var place='📍 '+[it.area,it.spot,it.direction?('direction '+it.direction):''].filter(Boolean).join(', ');
  if(it.status==='cleared')return '✅ KHELES – '+it.area+'\nRafa3o el hajiz 3al '+clock(it.clearedAt||Date.now());
  if(it.status==='unconfirmed')return '⚠️ UNCONFIRMED\n'+place+'\n🕘 '+clock(it.reportedAt)+'\nFi khabar 3an hajiz, ntezro ta2kid';
  var t='🚨 HAJIZ – CONFIRMED\n'+place+'\n🕘 '+clock(it.reportedAt)+'\n🚛 '+kindOf(it.kind).az;
  if(it.reports>1)t+='\n👥 '+it.reports+' reports';
  if(it.note)t+='\n'+it.note;
  return t;
}

function chip(it){
  if(it.status==='cleared')return '<span class="chip cleared">'+L('cleared')+'</span>';
  if(!isCurrent(it))return '<span class="chip expired">'+L('expired')+'</span>';
  return it.status==='confirmed'?'<span class="chip confirmed">'+L('confirmed')+'</span>':'<span class="chip unconfirmed">'+L('unconfirmed')+'</span>';
}

function cardHTML(it,mode){
  var live=isCurrent(it);
  var h='<article class="card'+(live?(it.status==='confirmed'?' live':''):' old')+'">';
  h+='<div class="card-top"><h3 class="area disp">'+esc(it.area)+'</h3>'+chip(it)+'</div>';
  var w=whereLine(it);if(w)h+='<div class="where">'+esc(w)+'</div>';
  h+='<div>'+esc(kindOf(it.kind)[lang])+'</div>';
  if(it.note)h+='<div class="note">'+esc(it.note)+'</div>';
  h+='<div class="row meta"><bdi class="mono">'+clock(it.reportedAt)+'</bdi><span data-ts="'+it.reportedAt+'">'+ago(it.reportedAt)+'</span>';
  if(it.reports>1)h+='<span>'+L('reports')(it.reports)+'</span>';
  if(it.status==='cleared'&&it.clearedAt)h+='<span>'+L('clearedAt')+' <bdi>'+clock(it.clearedAt)+'</bdi></span>';
  h+='</div>';
  if(mode==='admin'){
    h+='<div class="actions">';
    if(it.status==='unconfirmed')h+='<button class="btn small" data-act="confirm" data-id="'+it.id+'">'+L('bConfirm')+'</button>';
    if(it.status!=='cleared')h+='<button class="btn small" data-act="plus" data-id="'+it.id+'">'+L('bPlus')+'</button><button class="btn small" data-act="clear" data-id="'+it.id+'">'+L('bClear')+'</button>';
    else h+='<button class="btn small" data-act="reopen" data-id="'+it.id+'">'+L('bReopen')+'</button>';
    h+='<button class="btn small primary" data-act="copy" data-id="'+it.id+'">'+L('bCopy')+'</button>';
    h+='<button class="btn small" data-act="edit" data-id="'+it.id+'">'+L('bEdit')+'</button>';
    h+='<button class="btn small danger" data-act="del" data-id="'+it.id+'">'+L('bDel')+'</button>';
    h+='</div>';
  }
  return h+'</article>';
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;var a=b.getAttribute('data-act'),id=b.getAttribute('data-id'),adId=b.getAttribute('data-ad');
  if(a==='go'){view=b.getAttribute('data-view');try{history.replaceState(null,'','#'+view);}catch(_){location.hash=view;}render();window.scrollTo(0,0);return;}
  if(a==='lang'){lang=lang==='ar'?'en':'ar';ls('hw-lang',lang);applyLang();render();return;}
  if(a==='theme'){var nt=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',nt);ls('hw-theme',nt);render();return;}
  if(a==='donate')return donate();
  if(a==='close-overlay'){var o=b.closest('.overlay');if(o)o.remove();return;}
  if(a==='copy-whish')return copy(state.settings.whishNumber,L('copiedNum'));
  if(a==='copy-report')return copy(reportText(),L('copiedMsg'));
  if(a==='publish')return save();
  if(a==='logout'){authed=false;ss('hw-admin',null);view='current';render();return;}
  if(a==='gh-clear'){ls('hw-gh-token',null);render();return;}
  if(a==='cancel-edit'){editingId=null;render();return;}
  if(a==='ad-cancel'){editingAd=null;pendingImg=undefined;render();return;}
  if(a==='ad-ph'){state.settings.adPlaceholder=b.checked;changed();return;}
  if(a==='ad-img-rm'){pendingImg='';var pv=document.getElementById('ad-img-preview');pv.hidden=true;pv.removeAttribute('src');b.hidden=true;var fi=document.getElementById('ad-img');if(fi)fi.value='';return;}
  if(adId){
    var ad=findAd(adId);if(!ad)return;
    if(a==='ad-toggle'){ad.on=ad.on===false;changed();return;}
    if(a==='ad-edit'){editingAd=adId;pendingImg=undefined;render();var af=document.getElementById('adm-ad-form');if(af)af.scrollIntoView({block:'start'});return;}
    if(a==='ad-del'){twoTap(b,'ad'+adId,function(){state.settings.ads=state.settings.ads.filter(function(x){return x.id!==adId;});if(editingAd===adId)editingAd=null;changed();});return;}
    return;
  }
  var it=find(id);if(!it)return;
  if(a==='copy')return copy(channelText(it),L('copiedCh'));
  if(a==='edit'){editingId=id;render();var f=document.getElementById('item-form');if(f)f.scrollIntoView({block:'start'});return;}
  if(a==='del'){twoTap(b,id,function(){state.items=state.items.filter(function(x){return x.id!==id;});changed();});return;}
  if(a==='confirm')it.status='confirmed';
  if(a==='plus'){it.reports=(it.reports||1)+1;if(it.reports>=2&&it.status==='unconfirmed')it.status='confirmed';}
  if(a==='clear'){it.status='cleared';it.clearedAt=Date.now();}
  if(a==='reopen'){it.status='confirmed';it.clearedAt=null;it.reportedAt=Date.now();}
  changed();
});

function sha256hex(str){
  if(!window.crypto||!crypto.subtle)return Promise.reject(new Error('nocrypto'));
  return crypto.subtle.digest('SHA-256',new TextEncoder().encode(str)).then(function(buf){return Array.prototype.map.call(new Uint8Array(buf),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');});
}

document.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target,g=function(id){return document.getElementById(id).value.trim();};
  if(f.id==='login-form'){
    var err=document.getElementById('lg-err');
    sha256hex(document.getElementById('lg-pass').value).then(function(hx){
      if(hx===PASS_HASH){authed=true;ss('hw-admin','1');render();checkStash();}
      else{err.textContent=L('lWrong');err.hidden=false;}
    },function(){err.textContent=L('lNoCrypto');err.hidden=false;});
    return;
  }
  if(f.id==='gh-form'){var tk=g('gh-token');if(tk){ls('hw-gh-token',tk);toast(L('ghSaved'));render();}return;}
  if(f.id==='item-form'){
    var area=g('ad-area');if(!area){document.getElementById('ad-area').focus();toast(L('aAreaFirst'));return;}
    var k=document.querySelector('input[name="ad-kind"]:checked');
    var tm=g('ad-time').split(':'),d=new Date();if(tm.length===2){d.setHours(+tm[0],+tm[1],0,0);if(d.getTime()>Date.now()+6e4)d=new Date(d.getTime()-864e5);}
    var status=g('ad-status');
    var rec={area:area,spot:g('ad-spot'),direction:g('ad-dir'),kind:k?k.value:'trailer',status:status,reportedAt:d.getTime(),reports:Math.max(1,parseInt(g('ad-reports'),10)||1),note:g('ad-note')};
    if(editingId){var it=find(editingId);if(it){var wasCleared=it.status==='cleared';Object.assign(it,rec);it.clearedAt=status==='cleared'?(wasCleared&&it.clearedAt?it.clearedAt:Date.now()):null;}editingId=null;toast(L('aSaved'));}
    else{rec.id=uid();rec.clearedAt=status==='cleared'?Date.now():null;state.items.unshift(rec);toast(L('aAdded'));}
    changed();return;
  }
  if(f.id==='adm-ad-form'){
    var cur=editingAd?findAd(editingAd):null;
    var img=pendingImg!==undefined?pendingImg:(cur?cur.image:'');
    var title=g('ad-title');if(!title&&!img){toast(L('adNeed'));return;}
    var sd=g('ad-start'),start=sd?new Date(sd+'T00:00').getTime():Date.now();if(isNaN(start))start=Date.now();
    var days=parseInt(g('ad-days'),10),end=days>0?start+days*864e5:null;
    var rec2={title:title,text:g('ad-text'),link:safeLink(g('ad-link')),image:img,start:start,end:end};
    if(cur)Object.assign(cur,rec2);else{rec2.id='a'+uid();rec2.on=true;state.settings.ads.unshift(rec2);}
    editingAd=null;pendingImg=undefined;toast(L('adPhSaved'));changed();return;
  }
  if(f.id==='settings-form'){
    var s=state.settings;s.name=g('st-name')||DEF.name;s.nameAr=g('st-namear')||DEF.nameAr;s.reportNumber=g('st-report');s.whishNumber=g('st-whish');s.whishName=g('st-whishname');
    s.channelLink=safeLink(g('st-channel'));s.staleHours=Math.min(48,Math.max(1,parseInt(g('st-stale'),10)||2));
    toast(L('sApplied'));changed();return;
  }
});

/* ---- saving: GitHub Pages (data.json via the GitHub API) or the claude.ai page itself ---- */
function save(){if(busy)return;if(GH)return ghSave();return publish();}
function b64(str){return btoa(unescape(encodeURIComponent(str)));}
function ghSave(){
  var tk=ls('hw-gh-token');if(!tk){toast(L('ghMissing'));return;}
  busy=true;render();
  var url='https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/data.json',hd={'Authorization':'Bearer '+tk,'Accept':'application/vnd.github+json'};
  var out=JSON.parse(JSON.stringify(state));out.updatedAt=Date.now();
  fetch(url,{headers:hd,cache:'no-store'}).then(function(r){if(r.status===401||r.status===403)throw {bad:1};return r.ok?r.json():{};}).then(function(cur){
    var body={message:'Update hawajiz '+new Date().toISOString(),content:b64(JSON.stringify(out,null,1))};if(cur&&cur.sha)body.sha=cur.sha;
    return fetch(url,{method:'PUT',headers:hd,body:JSON.stringify(body)});
  }).then(function(r){
    if(r.status===401||r.status===403||r.status===404)throw {bad:1};if(!r.ok)throw {code:r.status};
    state.updatedAt=out.updatedAt;dirty=false;busy=false;ss(STASH,null);render();toast(L('ghOk'));
  }).catch(function(e){busy=false;render();toast(e&&e.bad?L('ghBad'):L('pFail')+(e&&e.code?' ('+e.code+')':''));});
}
function buildDoc(st){
  var C='<'+'/script>',S='<'+'/style>';
  var json=JSON.stringify(st).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+S+'</head><body>\n'
    +'<title>Hawajiz Beirut</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'
    +'<link id="fonts" rel="stylesheet" href="'+esc(document.getElementById('fonts').getAttribute('href'))+'">\n'
    +'<style id="css">'+document.getElementById('css').textContent+S+'\n<div id="app"></div>\n'
    +'<script type="application/json" id="state">'+json+C+'\n'
    +'<script id="main">'+document.getElementById('main').textContent+C
    +'\n</body></html>';
}
function publish(){
  if(!art){readOnlyNote=L('pRO');render();return;}
  busy=true;render();state.updatedAt=Date.now();
  ss(STASH,JSON.stringify({state:state,publishedAt:state.updatedAt}));
  art.publish(buildDoc(state)).then(function(){toast(L('published'));},function(err){
    busy=false;var c=err&&err.code;
    if(c==='conflict'){toast(L('pConflict'));return;}
    if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'||c==='capability_removed'||c==='not_declared'){readOnlyNote=L('pRO');render();return;}
    if(c==='rate_limited'){toast(L('pRate'));render();return;}
    toast(L('pFail')+(c?' ('+c+')':''));render();
  });
}
function checkStash(){
  var raw=ss(STASH);if(!raw||!authed)return;var st;try{st=JSON.parse(raw);}catch(e){return;}
  if(!st||!st.state)return;
  if(st.publishedAt&&st.publishedAt===state.updatedAt){ss(STASH,null);return;}
  if(JSON.stringify(st.state.items)===JSON.stringify(state.items)&&JSON.stringify(st.state.settings)===JSON.stringify(state.settings))return;
  state=normalize(st.state);dirty=true;render();toast(L('restored'));
}

/* ---- loading ---- */
function loadData(first){
  if(!GH)return;
  fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){
    if(dirty)return;state=normalize(d);loaded=true;render();if(first)checkStash();
  }).catch(function(){if(!loaded){loaded=true;render();}});
}
function initCaps(){
  if(GH)return true;
  if(!window.claude||!window.claude.use)return false;
  window.claude.use('user').then(function(user){
    if(!user)return;return user.canEdit().then(function(can){
      if(!can)return;return window.claude.use('artifact').then(function(ns){
        if(!ns)return;art=ns;adminAllowed=true;if(location.hash==='#admin')view='admin';render();checkStash();
      });
    });
  }).catch(function(){});
  return true;
}

var hs=location.hash.slice(1);if(['current','report','old','admin'].indexOf(hs)>=0)view=hs;
render();
loadData(true);
if(!initCaps()){var tries=0;var iv=setInterval(function(){tries++;if(initCaps()||tries>10)clearInterval(iv);},500);}
window.addEventListener('hashchange',function(){var v=location.hash.slice(1);if(['current','report','old','admin'].indexOf(v)>=0&&v!==view){view=v;render();}});
setInterval(function(){
  if(view==='current'||view==='old'){if(GH)loadData(false);else render();}
  else document.querySelectorAll('[data-ts]').forEach(function(el){el.textContent=ago(+el.getAttribute('data-ts'));});
},60000);
setInterval(function(){
  var slot=document.getElementById('adslot');if(!slot)return;if(activeAds().length<2)return;adIndex++;slot.innerHTML=adInner();
},7000);
})();
</script>
